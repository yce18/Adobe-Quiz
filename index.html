<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe BDR Knowledge Quiz</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red:        #FA0F00;
            --red-dark:   #D40D00;
            --red-bg:     #FFF2F1;
            --dark:       #1A1A1A;
            --mid:        #2C2C2C;
            --gray:       #6E6E6E;
            --light:      #F4F4F4;
            --border:     #E1E1E1;
            --white:      #FFFFFF;
            --green:      #12B76A;
            --green-bg:   #ECFDF3;
            --yellow:     #F59E0B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #EBEBEB;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px 64px;
        }

        /* ── Layout ── */
        .wrap { width: 100%; max-width: 640px; }

        .logo-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo-a {
            width: 42px; height: 42px;
            background: var(--red);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            font-size: 24px; font-weight: 900;
            letter-spacing: -2px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(250,15,0,0.35);
        }

        .logo-label { line-height: 1.3; }
        .logo-label strong { font-size: 15px; font-weight: 700; color: var(--dark); }
        .logo-label span {
            display: block; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.7px; color: var(--gray);
        }

        .card {
            background: var(--white);
            border-radius: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07), 0 6px 24px rgba(0,0,0,0.08);
            padding: 32px;
        }

        @media (max-width: 480px) {
            .card { padding: 24px 18px; border-radius: 14px; }
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* ── Buttons ── */
        .btn {
            display: block; width: 100%;
            padding: 14px 20px;
            border-radius: 11px; border: none;
            font-size: 15px; font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s, opacity 0.2s;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.98); }

        .btn-primary { background: var(--red); color: #fff; }
        .btn-primary:hover { background: var(--red-dark); }

        .btn-secondary {
            background: var(--light); color: var(--dark);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover { background: var(--border); }

        .btn-ghost {
            background: transparent; color: var(--red);
            border: 1.5px solid var(--red);
            font-size: 13px; padding: 7px 14px;
            width: auto; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-ghost:hover { background: var(--red-bg); }

        /* ── Welcome Screen ── */
        .welcome-hero { text-align: center; margin-bottom: 28px; }
        .welcome-hero h1 {
            font-size: 27px; font-weight: 800; color: var(--dark);
            line-height: 1.25; margin-bottom: 8px;
        }
        .welcome-hero h1 em { font-style: normal; color: var(--red); }
        .welcome-hero p { color: var(--gray); font-size: 14px; }

        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 26px;
        }
        .stat-box {
            background: var(--light); border-radius: 11px;
            padding: 14px 10px; text-align: center;
        }
        .stat-box .num { font-size: 22px; font-weight: 800; color: var(--dark); }
        .stat-box .lbl {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--gray); margin-top: 3px;
        }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--dark); margin-bottom: 7px; }
        .form-input {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 15px; color: var(--dark); outline: none;
            transition: border-color 0.2s; background: var(--white);
            font-family: inherit;
        }
        .form-input:focus { border-color: var(--red); }
        .form-input.error { border-color: var(--red); animation: shake 0.3s; }

        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-6px)}
            75%{transform:translateX(6px)}
        }

        /* ── Leaderboard ── */
        .lb-section { margin-top: 28px; }
        .section-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--gray);
        }
        .lb-empty {
            text-align: center; color: var(--gray); font-size: 14px;
            padding: 22px; background: var(--light); border-radius: 10px;
        }
        .lb-list { display: flex; flex-direction: column; gap: 7px; }
        .lb-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; background: var(--light); border-radius: 10px;
        }
        .lb-row.r1 { background: #FFF9E6; }
        .lb-row.r2 { background: #F6F6F6; }
        .lb-row.r3 { background: #FFF2EC; }
        .lb-rank { font-size: 13px; font-weight: 700; color: var(--gray); width: 24px; text-align: center; flex-shrink: 0; }
        .lb-rank.medal { font-size: 17px; }
        .lb-name { flex: 1; font-weight: 600; font-size: 14px; color: var(--dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-pct { font-size: 14px; font-weight: 800; color: var(--dark); margin-right: 4px; }
        .lb-badge {
            font-size: 10px; font-weight: 800; padding: 3px 8px;
            border-radius: 20px; letter-spacing: 0.3px;
        }
        .lb-badge.pass { background: var(--green-bg); color: #0A9055; }
        .lb-badge.fail { background: var(--red-bg); color: #C0392B; }

        /* ── Quiz Screen ── */
        .quiz-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 18px;
        }
        .cat-badge {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 5px 12px;
            border-radius: 20px; background: var(--light); color: var(--gray);
        }
        .cat-badge.aem-sites     { background: #FFF0F0; color: #C41200; }
        .cat-badge.aem-assets    { background: #F0F4FF; color: #1D4ED8; }
        .cat-badge.aep-data      { background: #FFF8EC; color: #B45309; }
        .cat-badge.ajo-marketo   { background: #F0FFF4; color: #0A7040; }

        .q-progress { font-size: 13px; color: var(--gray); font-weight: 500; }

        .timer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .timer-track {
            flex: 1; height: 5px; background: var(--border);
            border-radius: 3px; overflow: hidden;
        }
        .timer-fill {
            height: 100%; border-radius: 3px;
            background: var(--red); transition: width 1s linear;
        }
        .timer-fill.warn   { background: var(--yellow); }
        .timer-fill.urgent { background: var(--red); animation: pulse-bar 0.5s infinite alternate; }
        @keyframes pulse-bar { to { opacity: 0.5; } }

        .timer-num { font-size: 14px; font-weight: 700; min-width: 26px; text-align: right; color: var(--dark); }
        .timer-num.warn   { color: var(--yellow); }
        .timer-num.urgent { color: var(--red); }

        .q-text {
            font-size: 19px; font-weight: 600; color: var(--dark);
            line-height: 1.55; margin-bottom: 22px;
        }

        .options { display: flex; flex-direction: column; gap: 9px; }
        .opt-btn {
            width: 100%; text-align: left;
            padding: 14px 18px; border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--light);
            font-size: 14px; color: var(--dark);
            cursor: pointer; transition: all 0.15s;
            font-family: inherit;
            display: flex; align-items: center; gap: 12px;
        }
        .opt-btn:hover:not(:disabled) { border-color: var(--red); background: var(--red-bg); }
        .opt-letter {
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--border); font-size: 12px; font-weight: 700;
            flex-shrink: 0; transition: all 0.15s;
        }
        .opt-btn.correct { background: var(--green-bg); border-color: var(--green); }
        .opt-btn.correct .opt-letter { background: var(--green); color: #fff; }
        .opt-btn.wrong   { background: var(--red-bg); border-color: var(--red); }
        .opt-btn.wrong   .opt-letter { background: var(--red); color: #fff; }
        .opt-btn:disabled { cursor: default; }

        .feedback {
            display: none; align-items: flex-start; gap: 10px;
            padding: 12px 16px; border-radius: 10px;
            font-size: 13.5px; font-weight: 500;
            margin-top: 14px; line-height: 1.5;
        }
        .feedback.show    { display: flex; }
        .feedback.correct { background: var(--green-bg); color: #0A7040; }
        .feedback.wrong   { background: var(--red-bg);   color: #8B1A10; }
        .feedback-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; }

        .next-wrap { margin-top: 18px; display: none; }

        /* ── Results Screen ── */
        .result-hero { text-align: center; padding: 20px 0 24px; }
        .result-emoji   { font-size: 52px; margin-bottom: 10px; }
        .result-verdict {
            font-size: 36px; font-weight: 900; letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .result-verdict.pass { color: var(--green); }
        .result-verdict.fail { color: var(--red); }
        .result-sub  { font-size: 16px; color: var(--gray); margin-bottom: 4px; }
        .result-hint { font-size: 13px; color: #AAAAAA; }

        .divider { height: 1px; background: var(--border); margin: 22px 0; }

        .breakdown-title {
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--gray); margin-bottom: 14px;
        }
        .breakdown-list { display: flex; flex-direction: column; gap: 13px; margin-bottom: 6px; }
        .bd-row  { display: flex; flex-direction: column; gap: 5px; }
        .bd-meta { display: flex; justify-content: space-between; font-size: 13px; }
        .bd-cat  { font-weight: 600; color: var(--dark); }
        .bd-score { color: var(--gray); }
        .bd-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .bd-fill  { height: 100%; border-radius: 3px; background: var(--red); }
        .bd-fill.good  { background: var(--yellow); }
        .bd-fill.great { background: var(--green); }

        .action-stack { display: flex; flex-direction: column; gap: 10px; }

        /* ── Fade-in on screen transition ── */
        .screen.active { animation: fadeUp 0.28s ease both; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="wrap">

    <!-- Logo bar -->
    <div class="logo-bar">
        <div class="logo-a">A</div>
        <div class="logo-label">
            <strong>Adobe BDR Knowledge Quiz</strong>
            <span>Product Certification &nbsp;·&nbsp; Sales Enablement</span>
        </div>
    </div>

    <!-- ═══════════════════════════════ WELCOME SCREEN ═══════════════════════════════ -->
    <div id="screen-welcome" class="screen card active">

        <div class="welcome-hero">
            <h1>Test Your <em>Adobe</em> Product Knowledge</h1>
            <p>40 questions in pool &nbsp;·&nbsp; 10 per quiz &nbsp;·&nbsp; 70% to pass</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="num" id="stat-players">0</div>
                <div class="lbl">Players</div>
            </div>
            <div class="stat-box">
                <div class="num" id="stat-avg">—</div>
                <div class="lbl">Avg Score</div>
            </div>
            <div class="stat-box">
                <div class="num" id="stat-passes">0</div>
                <div class="lbl">Passes</div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="player-name">Your Name</label>
            <input type="text" id="player-name" class="form-input"
                   placeholder="Enter your name to begin" maxlength="40" autocomplete="off" />
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">Start Quiz &rarr;</button>

        <div class="lb-section">
            <div class="section-head">
                <span class="section-title">&#127942; Leaderboard</span>
                <button class="btn btn-ghost" onclick="resetLeaderboard()">&#8635; Reset</button>
            </div>
            <div id="lb-welcome"></div>
        </div>
    </div>

    <!-- ═══════════════════════════════ QUIZ SCREEN ═══════════════════════════════ -->
    <div id="screen-quiz" class="screen card">
        <div class="quiz-header">
            <span class="cat-badge" id="q-cat">—</span>
            <span class="q-progress" id="q-progress">1 / 10</span>
        </div>

        <div class="timer-row">
            <div class="timer-track">
                <div class="timer-fill" id="timer-fill" style="width:100%"></div>
            </div>
            <div class="timer-num" id="timer-num">30</div>
        </div>

        <div class="q-text" id="q-text">Loading&hellip;</div>

        <div class="options" id="q-options"></div>

        <div class="feedback" id="feedback">
            <span class="feedback-icon" id="fb-icon"></span>
            <span id="fb-text"></span>
        </div>

        <div class="next-wrap" id="next-wrap">
            <button class="btn btn-primary" onclick="nextQuestion()">Next Question &rarr;</button>
        </div>
    </div>

    <!-- ═══════════════════════════════ RESULTS SCREEN ═══════════════════════════════ -->
    <div id="screen-results" class="screen card">
        <div class="result-hero">
            <div class="result-emoji"  id="r-emoji"></div>
            <div class="result-verdict" id="r-verdict"></div>
            <div class="result-sub"    id="r-sub"></div>
            <div class="result-hint"   id="r-hint"></div>
        </div>

        <div class="divider"></div>

        <div class="breakdown-title">Category Breakdown</div>
        <div class="breakdown-list" id="breakdown"></div>

        <div class="divider"></div>

        <div class="lb-section">
            <div class="section-head">
                <span class="section-title">&#127942; Leaderboard</span>
            </div>
            <div id="lb-results"></div>
        </div>

        <div class="divider"></div>

        <div class="action-stack">
            <button class="btn btn-primary"   onclick="restartQuiz()">Play Again</button>
            <button class="btn btn-secondary" onclick="goHome()">&larr; Back to Home</button>
        </div>
    </div>

</div><!-- /.wrap -->

<script>
// ════════════════════════════════════════════════════════════════════════════════
//  QUESTION BANK — 40 questions across 4 sections
//  Correct answers are distributed evenly: 10× A (0), 10× B (1), 10× C (2), 10× D (3)
// ════════════════════════════════════════════════════════════════════════════════
const QUESTION_BANK = [

    // ── SECTION 1: AEM Sites ──────────────────────────────────────────────────

    // correct: B (1)
    {
        question: "What is AEM Sites primarily used for?",
        options: [
            "Managing customer data and building real-time audience profiles",
            "Creating, managing, and delivering web content across channels — without depending on IT for every update",
            "Sending automated email campaigns to marketing leads",
            "Running paid social and search ad campaigns from a single dashboard"
        ],
        correctAnswer: 1,
        category: "AEM Sites"
    },
    // correct: A (0)
    {
        question: "A prospect says: 'Every time we need to update our website, we have to wait 2 weeks for IT.' Which AEM Sites feature directly solves this?",
        options: [
            "The WYSIWYG drag-and-drop authoring interface that lets marketers update pages without writing code",
            "Adobe Analytics integration showing which pages need the most urgent updates",
            "Dynamic Media, which auto-resizes images so developers don't have to",
            "AEM Cloud Manager, which automates deployments to cut DevOps back-and-forth"
        ],
        correctAnswer: 0,
        category: "AEM Sites"
    },
    // correct: C (2)
    {
        question: "What is 'headless CMS' in the context of AEM Sites?",
        options: [
            "A lightweight version of AEM that removes the visual page editor",
            "AEM configured to run offline for on-site events without internet access",
            "A model where AEM manages content centrally but delivers it via API to any frontend — web, mobile, digital signage, or IoT",
            "A performance mode that strips page templates to improve load speed"
        ],
        correctAnswer: 2,
        category: "AEM Sites"
    },
    // correct: D (3)
    {
        question: "What is Edge Delivery Services (EDS) and why is it a competitive differentiator?",
        options: [
            "Adobe's managed CDN for high-volume video streaming, sold separately from AEM",
            "A dedicated email delivery engine embedded within AEM for transactional messaging",
            "A feature exclusive to AEM 6.5 LTS that optimises on-premise server performance",
            "A next-gen AEM capability where authors work in Google Docs or SharePoint and pages are served from the edge — achieving 100/100 Google Lighthouse scores"
        ],
        correctAnswer: 3,
        category: "AEM Sites"
    },
    // correct: A (0)
    {
        question: "A customer manages 30 regional websites in different languages. Which AEM Sites capability helps them manage this efficiently?",
        options: [
            "Live Copy and Multi-Site Manager (MSM) — roll out master content to all regional sites automatically while letting local teams override specific sections",
            "Adobe Target, which personalises content variants for visitors in each country",
            "Adobe Campaign, which handles multilingual email and SMS for each regional audience",
            "AEM Forms, which streamlines multilingual content requests from regional teams"
        ],
        correctAnswer: 0,
        category: "AEM Sites"
    },
    // correct: C (2)
    {
        question: "What are 'Experience Fragments' in AEM Sites?",
        options: [
            "Performance error logs generated when a page component fails to render",
            "Developer-maintained code modules used to extend AEM's backend functionality",
            "Reusable content-and-layout blocks — like a hero banner or CTA — that can be placed across pages or pushed to other channels such as email",
            "Pre-built audience segments from Adobe Analytics that trigger content variants"
        ],
        correctAnswer: 2,
        category: "AEM Sites"
    },
    // correct: B (1)
    {
        question: "What are the two main deployment options for AEM Sites today?",
        options: [
            "SaaS-only subscription — AEM no longer supports any on-premise installation",
            "AEM 6.5 LTS for organisations not yet ready to move, and AEM as a Cloud Service (AEMaaCS) — the modern path with auto-scaling, zero-downtime updates, and a built-in CDN",
            "Dedicated AWS or Azure marketplace deployments managed by the customer's cloud team",
            "Fully Adobe-managed PaaS with no infrastructure choices for the customer"
        ],
        correctAnswer: 1,
        category: "AEM Sites"
    },
    // correct: D (3)
    {
        question: "How does AEM Sites integrate with Adobe Target?",
        options: [
            "Target replaces AEM Sites whenever a personalised page version is needed",
            "AEM sends behavioural event data to Target, which then builds campaigns in Marketing Cloud",
            "The integration is only available for customers who also license Adobe Commerce",
            "AEM manages the content variants; Target decides in real time which version each visitor sees — enabling A/B testing and personalisation without re-publishing pages"
        ],
        correctAnswer: 3,
        category: "AEM Sites"
    },
    // correct: A (0)
    {
        question: "A Creative Cloud customer produces great brand content but struggles to distribute it consistently across their website, app, and partner portals. What is the AEM Sites pitch?",
        options: [
            "AEM Sites bridges Creative Cloud content into enterprise delivery — one platform to publish that content to every channel at scale, with brand governance and personalisation built in",
            "Recommend they hire specialist developers to manage each digital channel separately",
            "Adobe Express handles all distribution needs for existing Creative Cloud customers",
            "AEM is not the right fit when a customer already invests heavily in Creative Cloud"
        ],
        correctAnswer: 0,
        category: "AEM Sites"
    },
    // correct: C (2)
    {
        question: "What common business problem does AEM Sites solve that competitors like WordPress or Drupal struggle with at enterprise scale?",
        options: [
            "WordPress is cheaper and faster, so AEM doesn't address a problem WordPress can't already solve",
            "AEM Sites is exclusively designed for Fortune 100 companies and won't scale down",
            "AEM delivers enterprise-grade governance, security, personalisation, omnichannel delivery, and native Adobe ecosystem integration — capabilities that require heavy custom development on open-source CMSs",
            "Drupal already matches AEM's full enterprise feature set out-of-the-box"
        ],
        correctAnswer: 2,
        category: "AEM Sites"
    },

    // ── SECTION 2: AEM Assets ─────────────────────────────────────────────────

    // correct: D (3)
    {
        question: "What is the core job of AEM Assets?",
        options: [
            "A photo editing suite extending Adobe Photoshop for large creative teams",
            "A social media planning tool with built-in publishing and scheduling features",
            "A licensing and contract management tool for Adobe subscriptions",
            "A centralised Digital Asset Management system — the single source of truth for storing, finding, and distributing all approved brand assets"
        ],
        correctAnswer: 3,
        category: "AEM Assets"
    },
    // correct: B (1)
    {
        question: "A prospect says: 'Our teams use 5 different tools to store files and nobody can find the right version.' Which AEM Assets capability directly addresses this?",
        options: [
            "Adobe Firefly, which generates brand-new AI images to replace lost originals",
            "AEM Assets as a unified DAM with version control, smart search, and role-based access — one governed place where every team finds the latest approved file",
            "Adobe Express, which lets anyone quickly recreate assets from scratch",
            "Adobe Workfront, which tracks asset requests and creative project timelines"
        ],
        correctAnswer: 1,
        category: "AEM Assets"
    },
    // correct: A (0)
    {
        question: "What does 'Smart Tags' do in AEM Assets?",
        options: [
            "Uses Adobe Sensei AI to analyse uploaded assets and apply relevant keyword tags based on visual content and your business taxonomy — dramatically speeding up search",
            "Automatically adds a visible watermark to every asset uploaded to the DAM",
            "Assigns the uploader's name and department as the primary metadata tag on each file",
            "Pushes newly tagged assets directly to connected social media accounts"
        ],
        correctAnswer: 0,
        category: "AEM Assets"
    },
    // correct: C (2)
    {
        question: "What is Dynamic Media in AEM Assets?",
        options: [
            "An integration with major social platforms for scheduling and posting brand content",
            "A premium add-on connecting AEM Assets to Adobe Stock for licensed image delivery",
            "A capability that auto-delivers the right image or video size, format, and crop for each device and channel — from one master asset, with no manual variants needed",
            "A dedicated subtitle and caption management tool for video-heavy DAM libraries"
        ],
        correctAnswer: 2,
        category: "AEM Assets"
    },
    // correct: B (1)
    {
        question: "What is the difference between AEM Assets Prime and AEM Assets Ultimate?",
        options: [
            "Prime is the legacy on-premise version; Ultimate is its cloud-only successor",
            "Both are tiers of AEM Assets as a Cloud Service — Ultimate adds Content Hub for brand distribution and more advanced AI automation on top of the core DAM",
            "Ultimate is scoped for video-heavy workflows; Prime covers images and documents only",
            "The two tiers are functionally identical — the only difference is support SLA"
        ],
        correctAnswer: 1,
        category: "AEM Assets"
    },

// ════════════════════════════════════════════════════════════════════════════════
//  CONFIG — adjust these values as needed
// ════════════════════════════════════════════════════════════════════════════════
const PASS_THRESHOLD    = 0.70;   // 70% required to pass
const TIMER_SECS        = 30;     // seconds per question
const LB_STORAGE_KEY    = 'adobe_bdr_quiz_v1';
const MAX_LB_ENTRIES    = 10;     // top entries to keep
const QUESTIONS_PER_RUN = 10;     // how many questions per quiz

// ════════════════════════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════════════════════════
let S = {
    name:      '',
    questions: [],
    idx:       0,
    answers:   [],   // array of { correct: bool, category: string }
    timerID:   null,
    timeLeft:  TIMER_SECS,
    answered:  false
};

// ════════════════════════════════════════════════════════════════════════════════
//  LEADERBOARD
// ════════════════════════════════════════════════════════════════════════════════
function loadLB() {
    try { return JSON.parse(localStorage.getItem(LB_STORAGE_KEY)) || []; }
    catch { return []; }
}

function saveLB(lb) {
    localStorage.setItem(LB_STORAGE_KEY, JSON.stringify(lb));
}

function addScore(name, correct, total) {
    const pct = Math.round((correct / total) * 100);
    const lb  = loadLB();
    lb.push({
        name, correct, total, pct,
        pass: pct >= Math.round(PASS_THRESHOLD * 100),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    });
    lb.sort((a, b) => b.pct - a.pct || b.correct - a.correct);
    saveLB(lb.slice(0, MAX_LB_ENTRIES));
}

function renderLB(containerId) {
    const lb  = loadLB();
    const el  = document.getElementById(containerId);
    if (!el) return;
    if (!lb.length) {
        el.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>';
        return;
    }
    const medals = ['🥇','🥈','🥉'];
    el.innerHTML = '<div class="lb-list">' +
        lb.map((e, i) => `
            <div class="lb-row ${i < 3 ? 'r'+(i+1) : ''}">
                <span class="lb-rank ${i < 3 ? 'medal' : ''}">${i < 3 ? medals[i] : i+1}</span>
                <span class="lb-name">${esc(e.name)}</span>
                <span class="lb-pct">${e.pct}%</span>
                <span class="lb-badge ${e.pass ? 'pass' : 'fail'}">${e.pass ? 'PASS' : 'FAIL'}</span>
            </div>
        `).join('') +
    '</div>';
}

function updateStats() {
    const lb = loadLB();
    document.getElementById('stat-players').textContent = lb.length;
    if (lb.length) {
        const avg = Math.round(lb.reduce((s, e) => s + e.pct, 0) / lb.length);
        document.getElementById('stat-avg').textContent    = avg + '%';
        document.getElementById('stat-passes').textContent = lb.filter(e => e.pass).length;
    } else {
        document.getElementById('stat-avg').textContent    = '—';
        document.getElementById('stat-passes').textContent = '0';
    }
}

function resetLeaderboard() {
    if (!confirm('Clear the entire leaderboard? This cannot be undone.')) return;
    localStorage.removeItem(LB_STORAGE_KEY);
    renderLB('lb-welcome');
    updateStats();
}

// ════════════════════════════════════════════════════════════════════════════════
//  QUIZ LOGIC
// ════════════════════════════════════════════════════════════════════════════════
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function startQuiz() {
    const inp  = document.getElementById('player-name');
    const name = inp.value.trim();
    if (!name) {
        inp.classList.add('error');
        inp.focus();
        setTimeout(() => inp.classList.remove('error'), 600);
        return;
    }
    S.name      = name;
    S.questions = shuffle(QUESTION_BANK).slice(0, Math.min(QUESTIONS_PER_RUN, QUESTION_BANK.length));
    S.idx       = 0;
    S.answers   = [];
    showScreen('screen-quiz');
    loadQuestion();
}

function loadQuestion() {
    const q  = S.questions[S.idx];
    S.answered = false;

    // Category badge
    const catEl  = document.getElementById('q-cat');
    catEl.textContent = q.category;
    const catMap = {
        'AEM Sites':                  'aem-sites',
        'AEM Assets':                 'aem-assets',
        'AEP & Data':                 'aep-data',
        'AJO / Marketo / Workfront':  'ajo-marketo'
    };
    catEl.className = 'cat-badge ' + (catMap[q.category] || '');

    document.getElementById('q-progress').textContent = (S.idx + 1) + ' / ' + S.questions.length;
    document.getElementById('q-text').textContent     = q.question;

    // Render options
    const letters = ['A','B','C','D'];
    document.getElementById('q-options').innerHTML = q.options.map((opt, i) => `
        <button class="opt-btn" id="opt${i}" onclick="pick(${i})">
            <span class="opt-letter">${letters[i]}</span>
            <span>${esc(opt)}</span>
        </button>
    `).join('');

    // Reset feedback & next button
    document.getElementById('feedback').className  = 'feedback';
    document.getElementById('next-wrap').style.display = 'none';

    startTimer();
}

// ── Timer ──────────────────────────────────────────────────────────────────
function startTimer() {
    stopTimer();
    S.timeLeft = TIMER_SECS;
    paintTimer();
    S.timerID = setInterval(() => {
        S.timeLeft--;
        paintTimer();
        if (S.timeLeft <= 0) { stopTimer(); if (!S.answered) timeUp(); }
    }, 1000);
}

function stopTimer() {
    clearInterval(S.timerID);
    S.timerID = null;
}

function paintTimer() {
    const pct    = (S.timeLeft / TIMER_SECS) * 100;
    const fill   = document.getElementById('timer-fill');
    const num    = document.getElementById('timer-num');
    const urgent = S.timeLeft <= 5;
    const warn   = S.timeLeft <= 10 && !urgent;

    fill.style.width = pct + '%';
    num.textContent  = S.timeLeft;
    fill.className = 'timer-fill' + (urgent ? ' urgent' : warn ? ' warn' : '');
    num.className  = 'timer-num'  + (urgent ? ' urgent' : warn ? ' warn' : '');
}

function timeUp() {
    S.answered = true;
    const correct = S.questions[S.idx].correctAnswer;
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    document.getElementById('opt' + correct).classList.add('correct');
    S.answers.push({ correct: false, category: S.questions[S.idx].category });
    showFeedback(false, "Time's up! The correct answer is highlighted above.");
    document.getElementById('next-wrap').style.display = 'block';
}

// ── Answer selection ───────────────────────────────────────────────────────
function pick(idx) {
    if (S.answered) return;
    S.answered = true;
    stopTimer();

    const q     = S.questions[S.idx];
    const right = idx === q.correctAnswer;

    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    document.getElementById('opt' + idx).classList.add(right ? 'correct' : 'wrong');
    if (!right) document.getElementById('opt' + q.correctAnswer).classList.add('correct');

    S.answers.push({ correct: right, category: q.category });
    showFeedback(right,
        right
            ? 'Correct! Great work.'
            : 'Not quite. The correct answer is: "' + q.options[q.correctAnswer] + '"'
    );
    document.getElementById('next-wrap').style.display = 'block';
}

function showFeedback(ok, text) {
    const fb = document.getElementById('feedback');
    fb.className = 'feedback show ' + (ok ? 'correct' : 'wrong');
    document.getElementById('fb-icon').textContent = ok ? '✓' : '✗';
    document.getElementById('fb-text').textContent = text;
}

function nextQuestion() {
    S.idx++;
    if (S.idx >= S.questions.length) showResults();
    else loadQuestion();
}

// ════════════════════════════════════════════════════════════════════════════════
//  RESULTS
// ════════════════════════════════════════════════════════════════════════════════
function showResults() {
    const total   = S.answers.length;
    const correct = S.answers.filter(a => a.correct).length;
    const pct     = correct / total;
    const passed  = pct >= PASS_THRESHOLD;

    addScore(S.name, correct, total);

    document.getElementById('r-emoji').textContent    = passed ? '🎉' : '📚';
    document.getElementById('r-verdict').textContent  = passed ? 'PASS' : 'FAIL';
    document.getElementById('r-verdict').className    = 'result-verdict ' + (passed ? 'pass' : 'fail');
    document.getElementById('r-sub').textContent      = correct + ' / ' + total + ' correct — ' + Math.round(pct * 100) + '%';
    document.getElementById('r-hint').textContent     = passed
        ? 'Threshold: ' + Math.round(PASS_THRESHOLD * 100) + '% · Nicely done, ' + S.name + '!'
        : 'Threshold: ' + Math.round(PASS_THRESHOLD * 100) + '% · Keep studying and try again!';

    // Category breakdown
    const cats = {};
    S.answers.forEach(a => {
        if (!cats[a.category]) cats[a.category] = { c: 0, t: 0 };
        cats[a.category].t++;
        if (a.correct) cats[a.category].c++;
    });

    document.getElementById('breakdown').innerHTML = Object.entries(cats).map(([cat, d]) => {
        const p   = Math.round((d.c / d.t) * 100);
        const cls = p === 100 ? 'great' : p >= 60 ? 'good' : '';
        return `
            <div class="bd-row">
                <div class="bd-meta">
                    <span class="bd-cat">${esc(cat)}</span>
                    <span class="bd-score">${d.c}/${d.t} &nbsp;&middot;&nbsp; ${p}%</span>
                </div>
                <div class="bd-track">
                    <div class="bd-fill ${cls}" style="width:${p}%"></div>
                </div>
            </div>
        `;
    }).join('');

    renderLB('lb-results');
    showScreen('screen-results');
}

// ════════════════════════════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════════════════════════════
function restartQuiz() {
    stopTimer();
    // Re-use same name; just restart
    const name = S.name;
    S.name      = name;
    S.questions = shuffle(QUESTION_BANK).slice(0, Math.min(QUESTIONS_PER_RUN, QUESTION_BANK.length));
    S.idx       = 0;
    S.answers   = [];
    showScreen('screen-quiz');
    loadQuestion();
}

function goHome() {
    stopTimer();
    renderLB('lb-welcome');
    updateStats();
    showScreen('screen-welcome');
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════════════════════════════════════════════════
//  UTILITIES
// ════════════════════════════════════════════════════════════════════════════════
function esc(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// Enter key on name field starts the quiz
document.getElementById('player-name').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') startQuiz();
});

// ── Initialise
renderLB('lb-welcome');
updateStats();
</script>
