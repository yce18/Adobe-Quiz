<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe BDR Knowledge Quiz</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red:        #FA0F00;
            --red-dark:   #D40D00;
            --red-bg:     #FFF2F1;
            --dark:       #1A1A1A;
            --mid:        #2C2C2C;
            --gray:       #6E6E6E;
            --light:      #F4F4F4;
            --border:     #E1E1E1;
            --white:      #FFFFFF;
            --green:      #12B76A;
            --green-bg:   #ECFDF3;
            --yellow:     #F59E0B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #EBEBEB;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px 64px;
        }

        /* ── Layout ── */
        .wrap { width: 100%; max-width: 640px; }

        .logo-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo-a {
            width: 42px; height: 42px;
            background: var(--red);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            font-size: 24px; font-weight: 900;
            letter-spacing: -2px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(250,15,0,0.35);
        }

        .logo-label { line-height: 1.3; }
        .logo-label strong { font-size: 15px; font-weight: 700; color: var(--dark); }
        .logo-label span {
            display: block; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.7px; color: var(--gray);
        }

        .card {
            background: var(--white);
            border-radius: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07), 0 6px 24px rgba(0,0,0,0.08);
            padding: 32px;
        }

        @media (max-width: 480px) {
            .card { padding: 24px 18px; border-radius: 14px; }
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* ── Buttons ── */
        .btn {
            display: block; width: 100%;
            padding: 14px 20px;
            border-radius: 11px; border: none;
            font-size: 15px; font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s, opacity 0.2s;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.98); }

        .btn-primary { background: var(--red); color: #fff; }
        .btn-primary:hover { background: var(--red-dark); }

        .btn-secondary {
            background: var(--light); color: var(--dark);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover { background: var(--border); }

        .btn-ghost {
            background: transparent; color: var(--red);
            border: 1.5px solid var(--red);
            font-size: 13px; padding: 7px 14px;
            width: auto; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-ghost:hover { background: var(--red-bg); }

        /* ── Welcome Screen ── */
        .welcome-hero { text-align: center; margin-bottom: 28px; }
        .welcome-hero h1 {
            font-size: 27px; font-weight: 800; color: var(--dark);
            line-height: 1.25; margin-bottom: 8px;
        }
        .welcome-hero h1 em { font-style: normal; color: var(--red); }
        .welcome-hero p { color: var(--gray); font-size: 14px; }

        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 26px;
        }
        .stat-box {
            background: var(--light); border-radius: 11px;
            padding: 14px 10px; text-align: center;
        }
        .stat-box .num { font-size: 22px; font-weight: 800; color: var(--dark); }
        .stat-box .lbl {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--gray); margin-top: 3px;
        }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--dark); margin-bottom: 7px; }
        .form-input {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 15px; color: var(--dark); outline: none;
            transition: border-color 0.2s; background: var(--white);
            font-family: inherit;
        }
        .form-input:focus { border-color: var(--red); }
        .form-input.error { border-color: var(--red); animation: shake 0.3s; }

        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-6px)}
            75%{transform:translateX(6px)}
        }

        /* ── Leaderboard ── */
        .lb-section { margin-top: 28px; }
        .section-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--gray);
        }
        .lb-empty {
            text-align: center; color: var(--gray); font-size: 14px;
            padding: 22px; background: var(--light); border-radius: 10px;
        }
        .lb-list { display: flex; flex-direction: column; gap: 7px; }
        .lb-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; background: var(--light); border-radius: 10px;
        }
        .lb-row.r1 { background: #FFF9E6; }
        .lb-row.r2 { background: #F6F6F6; }
        .lb-row.r3 { background: #FFF2EC; }
        .lb-rank { font-size: 13px; font-weight: 700; color: var(--gray); width: 24px; text-align: center; flex-shrink: 0; }
        .lb-rank.medal { font-size: 17px; }
        .lb-name { flex: 1; font-weight: 600; font-size: 14px; color: var(--dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-pct { font-size: 14px; font-weight: 800; color: var(--dark); margin-right: 4px; }
        .lb-badge {
            font-size: 10px; font-weight: 800; padding: 3px 8px;
            border-radius: 20px; letter-spacing: 0.3px;
        }
        .lb-badge.pass { background: var(--green-bg); color: #0A9055; }
        .lb-badge.fail { background: var(--red-bg); color: #C0392B; }

        /* ── Quiz Screen ── */
        .quiz-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 18px;
        }
        .cat-badge {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 5px 12px;
            border-radius: 20px; background: var(--light); color: var(--gray);
        }
        .cat-badge.aem-sites     { background: #FFF0F0; color: #C41200; }
        .cat-badge.aem-assets    { background: #F0F4FF; color: #1D4ED8; }
        .cat-badge.aep-data      { background: #FFF8EC; color: #B45309; }
        .cat-badge.ajo-marketo   { background: #F0FFF4; color: #0A7040; }

        .q-progress { font-size: 13px; color: var(--gray); font-weight: 500; }

        .timer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .timer-track {
            flex: 1; height: 5px; background: var(--border);
            border-radius: 3px; overflow: hidden;
        }
        .timer-fill {
            height: 100%; border-radius: 3px;
            background: var(--red); transition: width 1s linear;
        }
        .timer-fill.warn   { background: var(--yellow); }
        .timer-fill.urgent { background: var(--red); animation: pulse-bar 0.5s infinite alternate; }
        @keyframes pulse-bar { to { opacity: 0.5; } }

        .timer-num { font-size: 14px; font-weight: 700; min-width: 26px; text-align: right; color: var(--dark); }
        .timer-num.warn   { color: var(--yellow); }
        .timer-num.urgent { color: var(--red); }

        .q-text {
            font-size: 19px; font-weight: 600; color: var(--dark);
            line-height: 1.55; margin-bottom: 22px;
        }

        .options { display: flex; flex-direction: column; gap: 9px; }
        .opt-btn {
            width: 100%; text-align: left;
            padding: 14px 18px; border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--light);
            font-size: 14px; color: var(--dark);
            cursor: pointer; transition: all 0.15s;
            font-family: inherit;
            display: flex; align-items: center; gap: 12px;
        }
        .opt-btn:hover:not(:disabled) { border-color: var(--red); background: var(--red-bg); }
        .opt-letter {
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--border); font-size: 12px; font-weight: 700;
            flex-shrink: 0; transition: all 0.15s;
        }
        .opt-btn.correct { background: var(--green-bg); border-color: var(--green); }
        .opt-btn.correct .opt-letter { background: var(--green); color: #fff; }
        .opt-btn.wrong   { background: var(--red-bg); border-color: var(--red); }
        .opt-btn.wrong   .opt-letter { background: var(--red); color: #fff; }
        .opt-btn:disabled { cursor: default; }

        .feedback {
            display: none; align-items: flex-start; gap: 10px;
            padding: 12px 16px; border-radius: 10px;
            font-size: 13.5px; font-weight: 500;
            margin-top: 14px; line-height: 1.5;
        }
        .feedback.show    { display: flex; }
        .feedback.correct { background: var(--green-bg); color: #0A7040; }
        .feedback.wrong   { background: var(--red-bg);   color: #8B1A10; }
        .feedback-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; }

        .next-wrap { margin-top: 18px; display: none; }

        /* ── Results Screen ── */
        .result-hero { text-align: center; padding: 20px 0 24px; }
        .result-emoji   { font-size: 52px; margin-bottom: 10px; }
        .result-verdict {
            font-size: 36px; font-weight: 900; letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .result-verdict.pass { color: var(--green); }
        .result-verdict.fail { color: var(--red); }
        .result-sub  { font-size: 16px; color: var(--gray); margin-bottom: 4px; }
        .result-hint { font-size: 13px; color: #AAAAAA; }

        .divider { height: 1px; background: var(--border); margin: 22px 0; }

        .breakdown-title {
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--gray); margin-bottom: 14px;
        }
        .breakdown-list { display: flex; flex-direction: column; gap: 13px; margin-bottom: 6px; }
        .bd-row  { display: flex; flex-direction: column; gap: 5px; }
        .bd-meta { display: flex; justify-content: space-between; font-size: 13px; }
        .bd-cat  { font-weight: 600; color: var(--dark); }
        .bd-score { color: var(--gray); }
        .bd-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .bd-fill  { height: 100%; border-radius: 3px; background: var(--red); }
        .bd-fill.good  { background: var(--yellow); }
        .bd-fill.great { background: var(--green); }

        .action-stack { display: flex; flex-direction: column; gap: 10px; }

        /* ── Fade-in on screen transition ── */
        .screen.active { animation: fadeUp 0.28s ease both; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="wrap">

    <!-- Logo bar -->
    <div class="logo-bar">
        <div class="logo-a">A</div>
        <div class="logo-label">
            <strong>Adobe BDR Knowledge Quiz</strong>
            <span>Product Certification &nbsp;·&nbsp; Sales Enablement</span>
        </div>
    </div>

    <!-- ═══════════════════════════════ WELCOME SCREEN ═══════════════════════════════ -->
    <div id="screen-welcome" class="screen card active">

        <div class="welcome-hero">
            <h1>Test Your <em>Adobe</em> Product Knowledge</h1>
            <p>40 questions in pool &nbsp;·&nbsp; 10 per quiz &nbsp;·&nbsp; 70% to pass</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="num" id="stat-players">0</div>
                <div class="lbl">Players</div>
            </div>
            <div class="stat-box">
                <div class="num" id="stat-avg">—</div>
                <div class="lbl">Avg Score</div>
            </div>
            <div class="stat-box">
                <div class="num" id="stat-passes">0</div>
                <div class="lbl">Passes</div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="player-name">Your Name</label>
            <input type="text" id="player-name" class="form-input"
                   placeholder="Enter your name to begin" maxlength="40" autocomplete="off" />
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">Start Quiz &rarr;</button>

        <div class="lb-section">
            <div class="section-head">
                <span class="section-title">&#127942; Leaderboard</span>
                <button class="btn btn-ghost" onclick="resetLeaderboard()">&#8635; Reset</button>
            </div>
            <div id="lb-welcome"></div>
        </div>
    </div>

    <!-- ═══════════════════════════════ QUIZ SCREEN ═══════════════════════════════ -->
    <div id="screen-quiz" class="screen card">
        <div class="quiz-header">
            <span class="cat-badge" id="q-cat">—</span>
            <span class="q-progress" id="q-progress">1 / 10</span>
        </div>

        <div class="timer-row">
            <div class="timer-track">
                <div class="timer-fill" id="timer-fill" style="width:100%"></div>
            </div>
            <div class="timer-num" id="timer-num">30</div>
        </div>

        <div class="q-text" id="q-text">Loading&hellip;</div>

        <div class="options" id="q-options"></div>

        <div class="feedback" id="feedback">
            <span class="feedback-icon" id="fb-icon"></span>
            <span id="fb-text"></span>
        </div>

        <div class="next-wrap" id="next-wrap">
            <button class="btn btn-primary" onclick="nextQuestion()">Next Question &rarr;</button>
        </div>
    </div>

    <!-- ═══════════════════════════════ RESULTS SCREEN ═══════════════════════════════ -->
    <div id="screen-results" class="screen card">
        <div class="result-hero">
            <div class="result-emoji"  id="r-emoji"></div>
            <div class="result-verdict" id="r-verdict"></div>
            <div class="result-sub"    id="r-sub"></div>
            <div class="result-hint"   id="r-hint"></div>
        </div>

        <div class="divider"></div>

        <div class="breakdown-title">Category Breakdown</div>
        <div class="breakdown-list" id="breakdown"></div>

        <div class="divider"></div>

        <div class="lb-section">
            <div class="section-head">
                <span class="section-title">&#127942; Leaderboard</span>
            </div>
            <div id="lb-results"></div>
        </div>

        <div class="divider"></div>

        <div class="action-stack">
            <button class="btn btn-primary"   onclick="restartQuiz()">Play Again</button>
            <button class="btn btn-secondary" onclick="goHome()">&larr; Back to Home</button>
        </div>
    </div>

</div><!-- /.wrap -->

<script>
// ════════════════════════════════════════════════════════════════════════════════
//  QUESTION BANK — 40 questions across 4 sections
//  Correct answers: 10× A, 10× B, 10× C, 10× D
//  Correct answers are intentionally SHORT; distractors are longer/more verbose
// ════════════════════════════════════════════════════════════════════════════════
const QUESTION_BANK = [

    // ── SECTION 1: AEM Sites ──────────────────────────────────────────────────

    // correct: B (1)
    {
        question: "What is AEM Sites primarily used for?",
        options: [
            "A customer data platform that ingests behavioural signals from web, mobile, and CRM to build unified real-time audience profiles for downstream activation",
            "Enterprise CMS — build, manage, and publish web experiences without relying on IT",
            "A marketing automation platform for running personalised email nurture sequences to inbound and outbound leads across multiple campaign workflows",
            "A paid media management suite that centralises social, display, and search campaign planning and budget allocation in one interface"
        ],
        correctAnswer: 1,
        category: "AEM Sites"
    },
    // correct: A (0)
    {
        question: "A prospect says: 'Every time we need to update our website, we have to wait 2 weeks for IT.' Which AEM Sites feature directly solves this?",
        options: [
            "Drag-and-drop authoring — marketers edit and publish pages directly, no code needed",
            "The Adobe Analytics integration, which generates page-level content freshness reports that content teams use to prioritise their update queue based on live traffic impact data",
            "Dynamic Media, which automates image resizing and device-specific reformatting so front-end developers no longer need to manually prepare variants for each breakpoint",
            "AEM Cloud Manager, which compresses the CI/CD pipeline and automates infrastructure deployments, cutting the number of IT change-request tickets raised for content updates"
        ],
        correctAnswer: 0,
        category: "AEM Sites"
    },
    // correct: C (2)
    {
        question: "What is 'headless CMS' in the context of AEM Sites?",
        options: [
            "A minimal AEM deployment mode that disables the visual page editor entirely, replacing it with a command-line-only interface designed for developer-centric content teams",
            "An AEM configuration that enables fully offline operation, allowing the platform to serve cached content at events or in environments without reliable internet connectivity",
            "Content managed in AEM, delivered via API to any frontend — one source, every channel",
            "A performance configuration that removes all server-side page template rendering and shifts processing to the client browser to improve time-to-first-byte on high-traffic pages"
        ],
        correctAnswer: 2,
        category: "AEM Sites"
    },
    // correct: D (3)
    {
        question: "What is Edge Delivery Services (EDS) and why is it a competitive differentiator for AEM?",
        options: [
            "A standalone, separately licensed CDN that enterprises use to serve high-definition video to global audiences with low buffering, sold independently of any AEM product tier",
            "A built-in transactional email engine within AEM that handles triggered message delivery for order confirmations, password resets, and account notifications at high send volumes",
            "A performance module restricted to AEM 6.5 LTS on-premise deployments that optimises rendering speed for organisations managing their own data centre infrastructure",
            "Document-based authoring in Docs or SharePoint, pages served from the edge — 100/100 Lighthouse"
        ],
        correctAnswer: 3,
        category: "AEM Sites"
    },
    // correct: A (0)
    {
        question: "A customer manages 30 regional websites in different languages. Which AEM Sites capability helps them manage this efficiently?",
        options: [
            "Multi-Site Manager and Live Copy — one master blueprint pushed to all regions, local overrides where needed",
            "Adobe Target, which uses geolocation and browser language settings to serve automatically personalised content variants to visitors from each of the 30 regional markets without separate site structures",
            "Adobe Campaign, which centralises multilingual email, SMS, and push notification campaigns for all regional marketing teams through a single shared workflow and approval interface",
            "AEM Forms, which provides regional teams with a standardised digital request form to submit localisation requirements to the central content and translation management team"
        ],
        correctAnswer: 0,
        category: "AEM Sites"
    },
    // correct: C (2)
    {
        question: "What are 'Experience Fragments' in AEM Sites?",
        options: [
            "Diagnostic error logs AEM generates and stores automatically whenever a page component fails during the server-side rendering or content publishing process",
            "OSGi bundle components that developer teams maintain within AEM's backend framework to extend or override standard platform behaviour for custom enterprise use cases",
            "Reusable content + layout blocks — hero, CTA, promo — droppable on any page or exported to email",
            "Pre-configured audience segments imported from Adobe Analytics that dynamically trigger different content variants based on visitor behaviour, campaign source, or lifecycle stage"
        ],
        correctAnswer: 2,
        category: "AEM Sites"
    },
    // correct: B (1)
    {
        question: "What are the two main deployment options for AEM Sites today?",
        options: [
            "AEM is a SaaS-only subscription — Adobe retired all on-premise licensing in 2022 as part of its cloud-first strategy and no longer supports any legacy on-premise path for existing customers",
            "AEM 6.5 LTS (on-prem for legacy) and AEM as a Cloud Service (cloud-native, recommended)",
            "AEM is available exclusively through AWS and Azure Marketplace as single-tenant deployments, with the customer's cloud team responsible for all infrastructure configuration and maintenance",
            "Adobe operates AEM as a fully managed platform-as-a-service with no deployment options — all infrastructure, scaling, patching, and upgrade decisions are handled entirely by Adobe with no customer input"
        ],
        correctAnswer: 1,
        category: "AEM Sites"
    },
    // correct: D (3)
    {
        question: "How does AEM Sites integrate with Adobe Target?",
        options: [
            "Adobe Target generates entirely new personalised page templates that replace AEM-authored pages whenever a specific audience segment qualifies for a customised on-site experience",
            "AEM pushes raw behavioural event streams to Target, which aggregates this data alongside third-party ad network signals to build retargeting audiences across Adobe Marketing Cloud",
            "The AEM–Target integration requires an active Adobe Commerce licence and is unavailable as a standalone capability for customers using AEM Sites without a commerce deployment",
            "AEM holds the content variants; Target picks which one each visitor sees in real time — no re-publishing"
        ],
        correctAnswer: 3,
        category: "AEM Sites"
    },
    // correct: A (0)
    {
        question: "A Creative Cloud customer produces great brand content but struggles to distribute it consistently across their website, app, and partner portals. What is the AEM Sites pitch?",
        options: [
            "AEM Sites activates Creative Cloud content at enterprise scale — publish to every channel with governance built in",
            "Recommend building a dedicated in-house development team for each digital touchpoint so content can be managed with channel-specific tooling, bespoke integrations, and technical expertise per platform",
            "Adobe Express is the recommended distribution solution for Creative Cloud customers, providing multi-channel publishing capabilities without requiring the additional investment or complexity of AEM",
            "AEM is generally not the right fit when a customer already invests heavily in Creative Cloud, since the two product lines serve entirely different buyer personas with limited integration overlap"
        ],
        correctAnswer: 0,
        category: "AEM Sites"
    },
    // correct: C (2)
    {
        question: "What business problem does AEM Sites solve that WordPress or Drupal struggle with at enterprise scale?",
        options: [
            "WordPress is faster to deploy and less expensive at enterprise scale, so AEM does not materially solve a content management problem that WordPress cannot already handle for large organisations",
            "AEM is designed exclusively for Fortune 100 organisations and is not commercially viable or technically appropriate for mid-market or growth-stage brands evaluating enterprise CMS platforms",
            "Native enterprise governance, security, personalisation, and Adobe ecosystem integration — no custom dev required",
            "Drupal offers equivalent functionality to AEM across multi-site management, granular role-based permissions, integrated personalisation, and DAM connectivity for enterprise deployments"
        ],
        correctAnswer: 2,
        category: "AEM Sites"
    },

    // ── SECTION 2: AEM Assets ─────────────────────────────────────────────────

    // correct: D (3)
    {
        question: "What is the core job of AEM Assets?",
        options: [
            "An AI-augmented photo editing suite built on top of Photoshop, designed for large in-house creative teams that need collaborative cloud-synced access to editing tools and shared asset libraries",
            "A social media content calendar and scheduling platform with built-in cross-channel publishing, performance analytics, and audience engagement tracking across all major networks",
            "A subscription and contract lifecycle management tool for tracking Adobe licence renewals, usage entitlements, and enterprise agreement compliance across global deployments",
            "Enterprise DAM — one governed place to store, find, and distribute every approved brand asset"
        ],
        correctAnswer: 3,
        category: "AEM Assets"
    },
    // correct: B (1)
    {
        question: "A prospect says: 'Our teams use 5 different tools to store files and nobody can find the right version.' Which AEM Assets capability directly addresses this?",
        options: [
            "Adobe Firefly, which uses generative AI to recreate missing or outdated brand assets from text prompts, eliminating the need to locate or restore originals from fragmented legacy file systems",
            "One DAM — version control, smart search, role-based access, everyone on the latest approved file",
            "Adobe Express, which provides marketers with a template-based editing environment so they can quickly recreate any required asset without needing to locate an authoritative source file first",
            "Adobe Workfront, which implements a structured asset request and intake process that eliminates ad-hoc searching by routing all file requests through a formal project management workflow"
        ],
        correctAnswer: 1,
        category: "AEM Assets"

//  CONFIG — adjust these values as needed
// ════════════════════════════════════════════════════════════════════════════════
const PASS_THRESHOLD    = 0.70;   // 70% required to pass
const TIMER_SECS        = 30;     // seconds per question
const LB_STORAGE_KEY    = 'adobe_bdr_quiz_v1';
const MAX_LB_ENTRIES    = 10;     // top entries to keep
const QUESTIONS_PER_RUN = 10;     // how many questions per quiz

// ════════════════════════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════════════════════════
let S = {
    name:      '',
    questions: [],
    idx:       0,
    answers:   [],   // array of { correct: bool, category: string }
    timerID:   null,
    timeLeft:  TIMER_SECS,
    answered:  false
};

// ════════════════════════════════════════════════════════════════════════════════
//  LEADERBOARD
// ════════════════════════════════════════════════════════════════════════════════
function loadLB() {
    try { return JSON.parse(localStorage.getItem(LB_STORAGE_KEY)) || []; }
    catch { return []; }
}

function saveLB(lb) {
    localStorage.setItem(LB_STORAGE_KEY, JSON.stringify(lb));
}

function addScore(name, correct, total) {
    const pct = Math.round((correct / total) * 100);
    const lb  = loadLB();
    lb.push({
        name, correct, total, pct,
        pass: pct >= Math.round(PASS_THRESHOLD * 100),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    });
    lb.sort((a, b) => b.pct - a.pct || b.correct - a.correct);
    saveLB(lb.slice(0, MAX_LB_ENTRIES));
}

function renderLB(containerId) {
    const lb  = loadLB();
    const el  = document.getElementById(containerId);
    if (!el) return;
    if (!lb.length) {
        el.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>';
        return;
    }
    const medals = ['🥇','🥈','🥉'];
    el.innerHTML = '<div class="lb-list">' +
        lb.map((e, i) => `
            <div class="lb-row ${i < 3 ? 'r'+(i+1) : ''}">
                <span class="lb-rank ${i < 3 ? 'medal' : ''}">${i < 3 ? medals[i] : i+1}</span>
                <span class="lb-name">${esc(e.name)}</span>
                <span class="lb-pct">${e.pct}%</span>
                <span class="lb-badge ${e.pass ? 'pass' : 'fail'}">${e.pass ? 'PASS' : 'FAIL'}</span>
            </div>
        `).join('') +
    '</div>';
}

function updateStats() {
    const lb = loadLB();
    document.getElementById('stat-players').textContent = lb.length;
    if (lb.length) {
        const avg = Math.round(lb.reduce((s, e) => s + e.pct, 0) / lb.length);
        document.getElementById('stat-avg').textContent    = avg + '%';
        document.getElementById('stat-passes').textContent = lb.filter(e => e.pass).length;
    } else {
        document.getElementById('stat-avg').textContent    = '—';
        document.getElementById('stat-passes').textContent = '0';
    }
}

function resetLeaderboard() {
    if (!confirm('Clear the entire leaderboard? This cannot be undone.')) return;
    localStorage.removeItem(LB_STORAGE_KEY);
    renderLB('lb-welcome');
    updateStats();
}

// ════════════════════════════════════════════════════════════════════════════════
//  QUIZ LOGIC
// ════════════════════════════════════════════════════════════════════════════════
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function startQuiz() {
    const inp  = document.getElementById('player-name');
    const name = inp.value.trim();
    if (!name) {
        inp.classList.add('error');
        inp.focus();
        setTimeout(() => inp.classList.remove('error'), 600);
        return;
    }
    S.name      = name;
    S.questions = shuffle(QUESTION_BANK).slice(0, Math.min(QUESTIONS_PER_RUN, QUESTION_BANK.length));
    S.idx       = 0;
    S.answers   = [];
    showScreen('screen-quiz');
    loadQuestion();
}

function loadQuestion() {
    const q  = S.questions[S.idx];
    S.answered = false;

    // Category badge
    const catEl  = document.getElementById('q-cat');
    catEl.textContent = q.category;
    const catMap = {
        'AEM Sites':                  'aem-sites',
        'AEM Assets':                 'aem-assets',
        'AEP & Data':                 'aep-data',
        'AJO / Marketo / Workfront':  'ajo-marketo'
    };
    catEl.className = 'cat-badge ' + (catMap[q.category] || '');

    document.getElementById('q-progress').textContent = (S.idx + 1) + ' / ' + S.questions.length;
    document.getElementById('q-text').textContent     = q.question;

    // Render options
    const letters = ['A','B','C','D'];
    document.getElementById('q-options').innerHTML = q.options.map((opt, i) => `
        <button class="opt-btn" id="opt${i}" onclick="pick(${i})">
            <span class="opt-letter">${letters[i]}</span>
            <span>${esc(opt)}</span>
        </button>
    `).join('');

    // Reset feedback & next button
    document.getElementById('feedback').className  = 'feedback';
    document.getElementById('next-wrap').style.display = 'none';

    startTimer();
}

// ── Timer ──────────────────────────────────────────────────────────────────
function startTimer() {
    stopTimer();
    S.timeLeft = TIMER_SECS;
    paintTimer();
    S.timerID = setInterval(() => {
        S.timeLeft--;
        paintTimer();
        if (S.timeLeft <= 0) { stopTimer(); if (!S.answered) timeUp(); }
    }, 1000);
}

function stopTimer() {
    clearInterval(S.timerID);
    S.timerID = null;
}

function paintTimer() {
    const pct    = (S.timeLeft / TIMER_SECS) * 100;
    const fill   = document.getElementById('timer-fill');
    const num    = document.getElementById('timer-num');
    const urgent = S.timeLeft <= 5;
    const warn   = S.timeLeft <= 10 && !urgent;

    fill.style.width = pct + '%';
    num.textContent  = S.timeLeft;
    fill.className = 'timer-fill' + (urgent ? ' urgent' : warn ? ' warn' : '');
    num.className  = 'timer-num'  + (urgent ? ' urgent' : warn ? ' warn' : '');
}

function timeUp() {
    S.answered = true;
    const correct = S.questions[S.idx].correctAnswer;
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    document.getElementById('opt' + correct).classList.add('correct');
    S.answers.push({ correct: false, category: S.questions[S.idx].category });
    showFeedback(false, "Time's up! The correct answer is highlighted above.");
    document.getElementById('next-wrap').style.display = 'block';
}

// ── Answer selection ───────────────────────────────────────────────────────
function pick(idx) {
    if (S.answered) return;
    S.answered = true;
    stopTimer();

    const q     = S.questions[S.idx];
    const right = idx === q.correctAnswer;

    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    document.getElementById('opt' + idx).classList.add(right ? 'correct' : 'wrong');
    if (!right) document.getElementById('opt' + q.correctAnswer).classList.add('correct');

    S.answers.push({ correct: right, category: q.category });
    showFeedback(right,
        right
            ? 'Correct! Great work.'
            : 'Not quite. The correct answer is: "' + q.options[q.correctAnswer] + '"'
    );
    document.getElementById('next-wrap').style.display = 'block';
}

function showFeedback(ok, text) {
    const fb = document.getElementById('feedback');
    fb.className = 'feedback show ' + (ok ? 'correct' : 'wrong');
    document.getElementById('fb-icon').textContent = ok ? '✓' : '✗';
    document.getElementById('fb-text').textContent = text;
}

function nextQuestion() {
    S.idx++;
    if (S.idx >= S.questions.length) showResults();
    else loadQuestion();
}

// ════════════════════════════════════════════════════════════════════════════════
//  RESULTS
// ════════════════════════════════════════════════════════════════════════════════
function showResults() {
    const total   = S.answers.length;
    const correct = S.answers.filter(a => a.correct).length;
    const pct     = correct / total;
    const passed  = pct >= PASS_THRESHOLD;

    addScore(S.name, correct, total);

    document.getElementById('r-emoji').textContent    = passed ? '🎉' : '📚';
    document.getElementById('r-verdict').textContent  = passed ? 'PASS' : 'FAIL';
    document.getElementById('r-verdict').className    = 'result-verdict ' + (passed ? 'pass' : 'fail');
    document.getElementById('r-sub').textContent      = correct + ' / ' + total + ' correct — ' + Math.round(pct * 100) + '%';
    document.getElementById('r-hint').textContent     = passed
        ? 'Threshold: ' + Math.round(PASS_THRESHOLD * 100) + '% · Nicely done, ' + S.name + '!'
        : 'Threshold: ' + Math.round(PASS_THRESHOLD * 100) + '% · Keep studying and try again!';

    // Category breakdown
    const cats = {};
    S.answers.forEach(a => {
        if (!cats[a.category]) cats[a.category] = { c: 0, t: 0 };
        cats[a.category].t++;
        if (a.correct) cats[a.category].c++;
    });

    document.getElementById('breakdown').innerHTML = Object.entries(cats).map(([cat, d]) => {
        const p   = Math.round((d.c / d.t) * 100);
        const cls = p === 100 ? 'great' : p >= 60 ? 'good' : '';
        return `
            <div class="bd-row">
                <div class="bd-meta">
                    <span class="bd-cat">${esc(cat)}</span>
                    <span class="bd-score">${d.c}/${d.t} &nbsp;&middot;&nbsp; ${p}%</span>
                </div>
                <div class="bd-track">
                    <div class="bd-fill ${cls}" style="width:${p}%"></div>
                </div>
            </div>
        `;
    }).join('');

    renderLB('lb-results');
    showScreen('screen-results');
}

// ════════════════════════════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════════════════════════════
function restartQuiz() {
    stopTimer();
    // Re-use same name; just restart
    const name = S.name;
    S.name      = name;
    S.questions = shuffle(QUESTION_BANK).slice(0, Math.min(QUESTIONS_PER_RUN, QUESTION_BANK.length));
    S.idx       = 0;
    S.answers   = [];
    showScreen('screen-quiz');
    loadQuestion();
}

function goHome() {
    stopTimer();
    renderLB('lb-welcome');
    updateStats();
    showScreen('screen-welcome');
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════════════════════════════════════════════════
//  UTILITIES
// ════════════════════════════════════════════════════════════════════════════════
function esc(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// Enter key on name field starts the quiz
document.getElementById('player-name').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') startQuiz();
});

// ── Initialise
renderLB('lb-welcome');
updateStats();
</script>
</body>
</html>
